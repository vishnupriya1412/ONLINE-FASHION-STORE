{% extends "base.html" %}
{% block title %}Delete product | Nambha Shop{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><p class="eyebrow">CONFIRM ACTION</p><h1 class="h3 fw-bold">Delete product?</h1><p class="text-muted">Are you sure you want to delete <strong>{{ product.name }}</strong>? This action cannot be undone.</p><form method="post">{% csrf_token %}<button class="btn btn-danger w-100">Yes, delete product</button></form><a href="{% url 'product_detail' product.pk %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a></div></div>
{% endblock %}
